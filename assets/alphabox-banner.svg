<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Alphabox</title>
  <desc id="d">Alphabox: the Alpha lives. An emulator of the DEC/HP AlphaServer ES40.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#141033"/>
      <stop offset="1" stop-color="#2a0f2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#ff5a36" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff5a36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="alpha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ff5a36"/>
      <stop offset="1" stop-color="#d6246e"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f3d"/>
      <stop offset="1" stop-color="#171a24"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a36"/>
      <stop offset="0.6" stop-color="#d6246e"/>
      <stop offset="1" stop-color="#d6246e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>

  <!-- circuit traces leaving the chip, framing the text along the margins -->
  <g fill="none" stroke="#5fd3ff" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M294 84H316L340 40H880L904 26H1180"/>
    <path d="M294 104H326L346 56H700"/>
    <path d="M294 236H316L340 290H900L920 302H1210"/>
    <path d="M294 216H326L346 282H640"/>
    <path d="M62 124H34"/>
    <path d="M62 204H28L14 218"/>
    <path d="M148 46V20H250"/>
    <path d="M208 274V300H290"/>
    <path d="M1060 110H1150L1172 132H1240"/>
    <path d="M1100 176H1200L1220 196H1250"/>
  </g>
  <g fill="#5fd3ff" fill-opacity="0.45">
    <circle cx="1180" cy="26" r="4"/>
    <circle cx="700" cy="56" r="4"/>
    <circle cx="1210" cy="302" r="4"/>
    <circle cx="640" cy="282" r="4"/>
    <circle cx="250" cy="20" r="4"/>
    <circle cx="290" cy="300" r="4"/>
    <circle cx="1060" cy="110" r="4"/>
    <circle cx="1100" cy="176" r="4"/>
  </g>

  <!-- the chip: a ceramic package with pins on all four sides -->
  <g>
    <g fill="#9aa3b5" fill-opacity="0.8">
      <!-- top and bottom pins -->
      <rect x="84" y="46" width="8" height="18" rx="2"/><rect x="104" y="46" width="8" height="18" rx="2"/>
      <rect x="124" y="46" width="8" height="18" rx="2"/><rect x="144" y="46" width="8" height="18" rx="2"/>
      <rect x="164" y="46" width="8" height="18" rx="2"/><rect x="184" y="46" width="8" height="18" rx="2"/>
      <rect x="204" y="46" width="8" height="18" rx="2"/><rect x="224" y="46" width="8" height="18" rx="2"/>
      <rect x="244" y="46" width="8" height="18" rx="2"/><rect x="264" y="46" width="8" height="18" rx="2"/>
      <rect x="84" y="256" width="8" height="18" rx="2"/><rect x="104" y="256" width="8" height="18" rx="2"/>
      <rect x="124" y="256" width="8" height="18" rx="2"/><rect x="144" y="256" width="8" height="18" rx="2"/>
      <rect x="164" y="256" width="8" height="18" rx="2"/><rect x="184" y="256" width="8" height="18" rx="2"/>
      <rect x="204" y="256" width="8" height="18" rx="2"/><rect x="224" y="256" width="8" height="18" rx="2"/>
      <rect x="244" y="256" width="8" height="18" rx="2"/><rect x="264" y="256" width="8" height="18" rx="2"/>
      <!-- left and right pins -->
      <rect x="62" y="80" width="18" height="8" rx="2"/><rect x="62" y="100" width="18" height="8" rx="2"/>
      <rect x="62" y="120" width="18" height="8" rx="2"/><rect x="62" y="140" width="18" height="8" rx="2"/>
      <rect x="62" y="160" width="18" height="8" rx="2"/><rect x="62" y="180" width="18" height="8" rx="2"/>
      <rect x="62" y="200" width="18" height="8" rx="2"/><rect x="62" y="220" width="18" height="8" rx="2"/>
      <rect x="62" y="240" width="18" height="8" rx="2"/>
      <rect x="276" y="80" width="18" height="8" rx="2"/><rect x="276" y="100" width="18" height="8" rx="2"/>
      <rect x="276" y="120" width="18" height="8" rx="2"/><rect x="276" y="140" width="18" height="8" rx="2"/>
      <rect x="276" y="160" width="18" height="8" rx="2"/><rect x="276" y="180" width="18" height="8" rx="2"/>
      <rect x="276" y="200" width="18" height="8" rx="2"/><rect x="276" y="220" width="18" height="8" rx="2"/>
      <rect x="276" y="240" width="18" height="8" rx="2"/>
    </g>
    <rect x="76" y="60" width="204" height="200" rx="16" fill="url(#die)" stroke="#3a4152" stroke-width="2"/>
    <rect x="92" y="76" width="172" height="168" rx="10" fill="none" stroke="#ff5a36" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="178" y="186" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="136" font-style="italic" fill="url(#alpha)">α</text>
    <text x="178" y="226" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" letter-spacing="3" fill="#9aa3b5">21264 · EV68</text>
    <circle cx="100" cy="84" r="4" fill="#9aa3b5" fill-opacity="0.6"/>
  </g>

  <!-- wordmark -->
  <text x="360" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-2" fill="#ffffff">Alphabox</text>
  <rect x="364" y="186" width="470" height="4" rx="2" fill="url(#rule)"/>
  <text x="362" y="232" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="300" fill="#ffd9c7">The Alpha lives.</text>
  <text x="364" y="274" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#8f98ad">AlphaServer ES40 · OpenVMS · Tru64 · NetBSD · Windows NT/2000</text>
</svg>
