name: Build, run test and upload binaries 

on: [push, pull_request]

jobs:

  linux-x86-clang:
    runs-on: "ubuntu-24.04"

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%dT%H%M')" >> $GITHUB_OUTPUT

    - name: Install build dependencies
      run: sudo apt -y update && sudo apt -y install libpcap-dev libslirp-dev libglib2.0-dev netcat-openbsd libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxtst-dev libxfixes-dev libxss-dev libxkbcommon-dev libwayland-dev libegl-dev

    - name: Create build environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_C_COMPILER="clang" -DCMAKE_CXX_COMPILER="clang++" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall"

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: cmake --build . --config Release
      env:
        MAKEFLAGS: "-j2"

    - name: Run unit tests
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: ctest --output-on-failure

    - name: Run test scripts
      working-directory: ${{runner.workspace}}/alphabox
      shell: bash
      run: ${{runner.workspace}}/alphabox/test/run

    - name: Upload Alphabox binary
      uses: actions/upload-artifact@v6
      with:
        name: Alphabox-linux-x86-clang-${{ env.BUILD_DATE }}
        path: ${{runner.workspace}}/build/alphabox 
      env:
        BUILD_DATE: ${{ steps.date.outputs.date }}

  linux-x86-gcc:
    runs-on: "ubuntu-24.04"

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%dT%H%M')" >> $GITHUB_OUTPUT
      
    - name: Install gcovr
      run: pip install gcovr

    - name: Install build dependencies
      run: sudo apt -y update && sudo apt -y install libpcap-dev libslirp-dev libglib2.0-dev netcat-openbsd libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxtst-dev libxfixes-dev libxss-dev libxkbcommon-dev libwayland-dev libegl-dev

    - name: Create build environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall" -DCMAKE_EXPORT_COMPILE_COMMANDS=1

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: cmake --build . --config Release
      env:
        MAKEFLAGS: "-j2"

    - name: Run unit tests
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: ctest --output-on-failure

    - name: Run test scripts
      working-directory: ${{runner.workspace}}/alphabox
      shell: bash
      run: ${{runner.workspace}}/alphabox/test/run

    - name: Upload Alphabox binary
      uses: actions/upload-artifact@v6
      with:
        name: Alphabox-linux-x86-gcc-${{ env.BUILD_DATE }}
        path: ${{runner.workspace}}/build/alphabox
      env:
        BUILD_DATE: ${{ steps.date.outputs.date }} 

  linux-arm64-gcc-jit:
    # Native 64-bit ARM with the AArch64 JIT: the only job that builds the
    # JIT (it is off by default), and the one that runs the instruction
    # oracle on both engines.
    runs-on: "ubuntu-24.04-arm"

    steps:
    - uses: actions/checkout@v5

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%dT%H%M')" >> $GITHUB_OUTPUT

    - name: Install build dependencies
      run: sudo apt -y update && sudo apt -y install libpcap-dev libslirp-dev libglib2.0-dev netcat-openbsd

    - name: Fetch asmjit at the pinned commit
      run: |
        git clone https://github.com/asmjit/asmjit third_party/asmjit
        git -C third_party/asmjit checkout 0bd5787b54b575ed94bf32ac452153b34385c514

    - name: Create build environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Release -DES40_DISABLE_ASMJIT=OFF -DDISABLE_SDL=yes -DCMAKE_CXX_FLAGS="-Wall"

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: cmake --build . --config Release
      env:
        MAKEFLAGS: "-j4"

    - name: Run unit tests
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: ctest --output-on-failure

    - name: Run the instruction oracle (interpreted and compiled passes)
      working-directory: ${{runner.workspace}}/alphabox
      shell: bash
      run: python3 test/cpu/cpu_oracle.py ${{runner.workspace}}/build/alphabox ci

    - name: Run test scripts
      working-directory: ${{runner.workspace}}/alphabox
      shell: bash
      run: ${{runner.workspace}}/alphabox/test/run

    - name: Upload Alphabox binary
      uses: actions/upload-artifact@v6
      with:
        name: Alphabox-linux-arm64-gcc-jit-${{ env.BUILD_DATE }}
        path: ${{runner.workspace}}/build/alphabox
      env:
        BUILD_DATE: ${{ steps.date.outputs.date }}

  windows-x86-msvc:
    # Paused: the MSVC build fails and its log is not public. One cause was
    # an unsigned __int128 (fixed); re-enable once the log shows the rest.
    if: false
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Create npcap sdk folder
      working-directory: ${{runner.workspace}}\
      run: mkdir pcap

    - name: Download npcap sdk
      working-directory: ${{runner.workspace}}\pcap
      run: curl -o ./npcap-sdk-1.13.zip https://npcap.com/dist/npcap-sdk-1.13.zip

    - name: unzip npcap sdk
      working-directory: ${{runner.workspace}}\pcap
      run: unzip npcap-sdk-1.13.zip

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%dT%H%M')" >> $GITHUB_OUTPUT

    - name: Create build environment
      run: cmake -E make_directory ${{runner.workspace}}\build

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Release  -DPCAP_INCLUDE_DIR="${{runner.workspace}}/pcap/Include/"  -DPCAP_LIBRARY="${{runner.workspace}}/pcap/Lib/x64/wpcap.lib"

    - name: Build
      working-directory: ${{runner.workspace}}\build
      shell: bash
      run: cmake --build . --config Release
      env:
        MAKEFLAGS: "-j2"

    - name: Test run
      working-directory: ${{runner.workspace}}\build
      run: ${{runner.workspace}}\build\Release\alphabox.exe

    - name: Upload Alphabox Binary
      uses: actions/upload-artifact@v6
      with:
        name: Alphabox-windows-x86-msvc-${{ env.BUILD_DATE }}.exe
        path: ${{runner.workspace}}\build\Release\alphabox.exe
      env:
        BUILD_DATE: ${{ steps.date.outputs.date }}

  osx-arm64-appleclang:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%dT%H%M')" >> $GITHUB_OUTPUT

    - name: Create build environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Install dependencies
      run: brew install libpcap libslirp netcat gnu-sed

    - name: Configure CMake
      shell: bash
      working-directory: ${{runner.workspace}}/build
      # SDL3 comes statically from the third_party/SDL submodule.
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall" -DPCAP_INCLUDE_DIR="$(brew --prefix libpcap)/include" -DPCAP_LIBRARY="$(brew --prefix libpcap)/lib/libpcap.dylib"

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: cmake --build . --config Release
      env:
        MAKEFLAGS: "-j3"

    - name: Run unit tests
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: ctest --output-on-failure

    - name: Upload Alphabox Binary
      uses: actions/upload-artifact@v6
      with:
        name: Alphabox-macos-arm64-appleclang-${{ env.BUILD_DATE }}
        path: ${{runner.workspace}}/build/alphabox
      env:
        BUILD_DATE: ${{ steps.date.outputs.date }} 

