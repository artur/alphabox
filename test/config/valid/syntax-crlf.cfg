/*
 * The syntax the parser accepts: comments of three kinds, quoting,
 * where braces and semicolons may go. syntax-crlf.cfg is this file with
 * CRLF line ends.
 */

; An INI-style comment: ';' first on its line.
	; after a tab, too.
// A C++ comment.

gui=sdl{keyboard.use_mapping=false;}   // all on one line, no spaces

sys0 = tsunami {          /* a block comment after a brace */
  memory.bits = 27; rom.srm = "cl67srmrom.exe";   // two on a line
  rom.flash	=	"flash.rom";                     // tabs
  rom.dpr = "with ""quotes"" and ; and = in it";
  time = "2000-01-01 12:00:00";
  exit_on_pal_halt=false;
  /* a block comment
     over two lines */
  cpu0 = ev68cb
  {
    speed = 1G512M;
  };                      // a stray ';' after a section
  ;                       // an empty line comment
  serial0 = serial { port = 21264; address = "127.0.0.1"; }
  pci0.7 = "ali"          // a quoted class
  {
    vga_console = false;
  }
  pci0.15 = ali_ide { }
  pci0.19 = ali_usb {}
  pci0.1 = sym53c810 {
    disk0.0 = file {
      file = "a_b.c";
      model_number = "Model ""X"" 2";
      read_only = no;
    }
  }
}
// The file ends in a comment, with a final newline.
