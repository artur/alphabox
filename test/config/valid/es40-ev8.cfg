// The ES40 with two EV8s (the `ev8` row, the 21464 in EV7-compatible
// mode): an Alphabox construction the board takes without a test hook
// (docs/cpu-fidelity.md, "The ES40 with EV7-family processors"). One TPU
// each: off the Marvel boards an ev8 is one processor.

sys0 = tsunami
{
  memory.bits = 28;
  rom.srm = "cl67srmrom.exe";
  cpu0 = ev8
  {
    speed = 800M;
  }
  cpu1 = ev8
  {
    speed = 800M;
    tpus = 1;
  }
  serial0 = serial
  {
    port = 21000;
  }
}
