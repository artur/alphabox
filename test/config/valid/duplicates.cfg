// A value named twice: the first one is used (test/tools/srm_cfg.py
// relies on that), and a section named twice makes two devices.
sys0 = tsunami
{
  memory.bits = 26;
  memory.bits = 30;
  rom.srm = "cl67srmrom.exe";
  cpu0 = ev68cb
  {
    speed = 500M;
    speed = 800M;
  }
  serial0 = serial
  {
    null_attach = true;
  }
  serial0 = serial
  {
    port = 21264;
  }
  pci0.7 = ali
  {
  }
}
