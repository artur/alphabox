// Ensoniq AudioPCI sound card
//
// An Ensoniq AudioPCI sound card, of one of two kinds. Both need the
// emulator compiled with SDL support, and neither takes any
// configuration value.
//
//   es1371   the AudioPCI 97: an AC'97 codec on a serial link and a
//            sample rate converter. This is the one the ES40 console
//            names in "show config", and the one Windows 2000 and
//            Windows NT 4 carry a driver for.
//   es1370   the part before it, with a mixer of its own and a fixed
//            set of playback rates. Windows NT 4 has a driver for it;
//            most other guests simply ignore it.

pci1.1 = es1371 {}
}
