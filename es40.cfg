// Specifying values
//
// Numeric values can be specified as a number ("500"), as a number with a
// suffix ("100K" = 102400), or as a fancy combination ("2G512M" = 2.5 G).
//
// Boolean values can be specified as "true"/"false", "yes"/"no", or "1"/"0".
//
// String-constants are best specified in double quotes ("string"). If the
// string needs to contain double quotes, double the double quotes.
// ("One ""word"" in this string is quoted")
//
// Comments
//
// Three comment forms are recognized: // and ; comment out the rest of the
// line (the ; form only when it is the first non-blank character on the
// line), and /* ... */ comments out a block. A ';' after a value keeps its
// usual meaning as the end of that setting.
//
// Unknown values
//
// The emulator knows which values each device class reads. Any value it
// finds in a device's section that the device does not read is ignored,
// and a warning is printed at startup so you can remove it from this file.

// GUI
//
// If you want to use an emulated graphics card, the emulator needs to interface
// with the OS'es user interface. The supported GUI is SDL (simple directmedia
// layer): gui=sdl. The emulator needs to be compiled with -DHAVE_SDL.
//
// gui=win32 is accepted for backward compatibility and now selects the SDL
// GUI as well. On systems built with X11 support, the legacy X11 GUI is
// still available (gui=X11), but it lags far behind the SDL GUI.

gui = sdl
{
  // VARIABLE: keyboard.use_mapping
  //
  // Use a keymap file to translate host keys to guest scancodes. Enable this
  // if you use a non-US keyboard layout. The default is false (US layout,
  // no translation).

  keyboard.use_mapping = false;

  // VARIABLE: keyboard.map
  //
  // The keymap file to use when keyboard.use_mapping is enabled. The default
  // is "keys.map".

  keyboard.map = "keys.map";

  // VARIABLE: mouse.speed
  //
  // Multiplier applied to host mouse motion before it is passed to the guest.
  // Use a value below 1.0 to slow the guest pointer down (e.g. 0.5 for half
  // speed), or above 1.0 (up to 10.0) to speed it up. The default is 1.0.

  //mouse.speed = 0.5;

  // VARIABLES: mouse.invert_x and mouse.invert_y
  //
  // Reverse the direction of host mouse motion on the horizontal and/or
  // vertical axis. Enable both if the guest pointer moves opposite to your
  // mouse or trackpad in both directions. The defaults are false.

  //mouse.invert_x = true;
  //mouse.invert_y = true;

  // VARIABLE: video.linear
  //
  // Filtering used when the guest display is scaled to the window size:
  // true = linear (smooth), false = nearest neighbor (sharp pixels).
  // The default is true.

  //video.linear = true;

  // VARIABLE: video.scale_ratio
  //
  // Integer scale factor for the emulator window (1 - 8). For example, 2
  // renders the guest's 640x480 display in a 1280x960 window. The default
  // is 0, which sizes the window automatically from the OS display scale
  // (DPI) setting.

  //video.scale_ratio = 2;

  // VARIABLE: video.scale_change_enable
  //
  // Allow changing the window scale factor at runtime with the
  // hotkey.scale_up (larger) and hotkey.scale_down (smaller) bindings. The
  // default is false. hotkey.reset_window works with or without this.

  //video.scale_change_enable = true;

  // VARIABLES: hotkey.*
  //
  // Host key combinations for the GUI actions. A binding is a quoted,
  // case-insensitive combination such as "Ctrl+F11" or "GUI+Shift+M":
  // modifiers first (Ctrl, Alt, Shift, GUI; the aliases Control, Option,
  // Command, Cmd, Super, Win, Windows and Meta are accepted), then exactly one
  // key by its SDL name (F1-F24, PageUp, PageDown, Home, End, Insert, Delete,
  // Escape, Backspace, letters, digits; PgUp, PgDn, Esc, Del, Ins and Bksp are
  // accepted too). The modifiers must match exactly: "Ctrl+F11" does not fire
  // while Shift is also held. "none" disables a binding. Invalid bindings, and
  // both actions of a duplicated combination, are reported at startup and
  // disabled. The active bindings are printed as %SDL-I-HOTKEYS and shown in
  // the window title.
  //
  // mouse_capture grabs/releases the mouse; media picks an image for the first
  // CD drive and media_force does the same past a guest lock (PREVENT MEDIUM
  // REMOVAL); ctrl_alt_delete sends Ctrl+Alt+Delete to the guest (Mac
  // keyboards without an End key can bind e.g. "GUI+Shift+D"); reset_window
  // restores the guest-driven window size; scale_up and scale_down change the
  // runtime scale (only with video.scale_change_enable = true).

  //hotkey.mouse_capture   = "Ctrl+F10";
  //hotkey.media           = "Ctrl+F11";
  //hotkey.media_force     = "Ctrl+Shift+F11";
  //hotkey.ctrl_alt_delete = "Ctrl+Alt+End";
  //hotkey.reset_window    = "Ctrl+Alt+Home";
  //hotkey.scale_up        = "Ctrl+PageUp";
  //hotkey.scale_down      = "Ctrl+PageDown";
}

sys0 = tsunami 
{
  // VARIABLE: platform
  //
  // The machine to emulate: which processors and how many it takes, how
  // much memory it holds, which PCI slots exist and where their interrupts
  // go, and which console firmware image it runs. The default is the
  // AlphaServer ES40, the only machine emulated so far;
  // docs/platforms.md describes how another is added.
  //
  //platform = "es40";


// VARIABLE: rom.srm
//
// Specify the filename of the original (compressed) ROM image. This file is 
// essential to the functioning of the emulator. This file an be obtained from HP 
// (it's on the firmware-update CD-ROM for Alpha ES40 systems).
//
  rom.srm = "rom\cl67srmrom.exe";

// VARIABLES: rom.flash and rom.dpr
//
// Specify the filenames of Flash and DPR ROM images. These files are not required,
// but will be created he first time the emulator runs.
// Contents of Flash and DPR ROM will be put in these files after successful 
// termination of the emulator. This allows setting SRM variables such as auto_action
// and boot_osflags. 
//
  rom.flash = "rom\flash.rom";
  rom.dpr = "rom\dpr.rom";

// VARIABLE: rom.decompressed
//
// Specify the filename of the decompressed ROM image. If possible, it will be
// created the first time the emulator is run. When it exists, it allows the
// emulator to start quicker by skipping the ROM decompression.
//
  rom.decompressed = "rom\decompressed.rom";

// VARIABLE: memory.bits
//
// Only amounts of memory that are a power of 2 are supported. This number
// determines the amount of memory, by setting the number of bits in the address
// (and thus which power of 2).
//
// 26 = 64 MB (the minimum)
// 27 = 128MB
// 28 = 256 MB
// 29 = 512 MB
// 30 = 1GB
// 31 = 2GB
// 32 = 4GB
// 33 = 8GB
// 34 = 16GB (2 memory arrays)
// 35 = 32GB (4 memory arrays, the maximum)
//
// Values outside 26..35 are refused at startup. The console sees matching
// DIMMs: four of total/4 (at most 1 GB each), then further sets of four on
// the next memory board.
//
  memory.bits = 30;

// VARIABLE: time
//
// Override the guest clock with a fixed date (or date+time). Interpreted as
// UTC, matching the runtime ARC/SRM TOY edit path — the value you write is
// what the guest sees.
// Sets the initial TOY offset; subsequent guest writes (ARC/SRM TOY edits or
// the OS setting the clock) take precedence and overwrite the offset for the
// rest of the run. The override does not survive emulator restart, so set
// this every launch if you need a stable fake date.
// Format: "YYYY-MM-DD" or "YYYY-MM-DD HH:MM:SS"
//
//time = "2017-05-01";              // fake date only
//time = "2017-05-01 12:00:00";     // fake date + time

// VARIABLE: arc_year_compat
//
// Encode the TOY year register as offset from 1980 (instead of the standard
// 2-digit year-mod-100 used by OpenVMS, Tru64 UNIX, Linux, etc).
//
// Background: the ARC console firmware on this emulator reads the TOY year
// byte with a 1980 base — for example, value 26 means 2006, value 46 means
// 2026. OpenVMS and other OSes read the same byte with a 2000 base (with a
// pivot at year 57 for 1900s vs 2000s, see EXE$GL_TRANSITION_YEAR). The two
// conventions disagree by 20 years, so only one console can display the
// correct year at a time.
//
// Off (default): year is encoded year-mod-100. OpenVMS/Tru64/Linux see the
// correct year. ARC displays year - 20 (e.g. 2006 instead of 2026).
//
// On: year is encoded as (year - 1980). ARC displays the correct year.
// OpenVMS will see year + 20 from the BBW (e.g. 2046 instead of 2026), and
// at boot will either prompt the operator for the date, or — if SYSGEN
// TIMEPROMPTWAIT is set to 0 — silently fall back to its last saved system
// time and continue normally.
//
//arc_year_compat = true;

// VARIABLE: exit_on_pal_halt
//
// Exit the emulator gracefully (flash and DPR saved) when a CPU calls the
// HALT PALcode function in kernel mode -- typically an operating system
// shutting down or halting, which would otherwise return to the SRM console.
// Useful for scripted and unattended runs. Default: false.
//
//exit_on_pal_halt = true;

  cpu0 = ev68cb
  {
    speed = 800M;

    // VARIABLE: palcode.vms.nohle
    //
    // Disable the high-level emulation (HLE) of the OpenVMS PALcode and run
    // the real SRM PALcode instead. Only meaningful on interpreter builds:
    // JIT builds always run the real PALcode, with or without this. Setting
    // it on any CPU applies it to all CPUs (mixing the two across CPUs is
    // not safe). The default is false (HLE enabled where available).

    //palcode.vms.nohle = true;

    // VARIABLE: skip_memtest_hack
    //
    // Skip the SRM console's memory test at startup, making boot
    // significantly faster. May not work with some firmware versions.
    // Interpreter builds only: JIT builds ignore it (with a warning), because
    // compiled code skips just part of the test and SRM then reports memory
    // errors. The default is false.

    //skip_memtest_hack = true;

    // VARIABLE: timer.max_instr_per_tick
    //
    // Upper bound on guest instructions a CPU retires between interval-timer
    // ticks (1024 Hz under Windows NT/2000). A CPU that reaches it before the
    // next wall-clock tick is due sleeps until the tick, so timing-sensitive
    // guest code sees a realistic CPU speed: 1250000 matches the fastest real
    // Alpha (1.25 GHz EV68) and fixes e.g. Windows 2000 build 2210 setup.
    // It throttles busy workloads to that speed, so the default is 0 (off).
    // Not applied under the SRM console.

    //timer.max_instr_per_tick = 1250000;
  }

  cpu1 = ev68cb
  {
    speed = 800M;
  }

// System Internal PCI Devices: ali, ali_ide, ali_usb
//
// The following PCI-devices are built into the system, and should
// always be at the PCI-id's they are on in this sample configuration
// file for compatibility. 

  pci0.7 = ali{
    lpt.outfile = "lpt.out";
    vga_console = true;

    // VARIABLE: timezone
    //
    // Base the guest TOY clock on "local" host time (the default) or "utc",
    // optionally with an offset: m = minutes, h = hours, d = days, M = months,
    // y = years. Examples:
    //
    //timezone = "utc";        // UTC
    //timezone = "utc+1h";     // UTC plus 1 hour
    //timezone = "local-20M";  // host local time minus 20 months
    //timezone = "utc+2y";     // UTC plus two years
  }

  pci0.15 = ali_ide
  {
    // VARIABLE: dma
    //
    // Allow the guest to use (busmaster) DMA transfers on this IDE
    // controller. Set to false to force PIO-only operation. The default
    // is true.

    //dma = false;

    // sub-components: disk<x>.<y>
    //
    // Here, up to 4 IDE disks can be defined (0.0, 0.1, 1.0 and 1.1).
    //
    // All disk types (file, device, ramdisk) accept the identity values
    // model_number, serial_number and rev_number, shown in the first disk
    // below. (serial_num and rev_num are accepted as aliases.)
    //
    // file: create a disk using a file on the host filesystem as a disk image

    disk0.0 = file
    {
      file =          "img\disk0.img";
      serial_number = "VMS";
      rev_number    = "8.3";
      model_number  = "OpenVMS8.3";
      read_only     = false;
      cdrom         = false;

      // if the file does not exist, it will be created if autocreate_size is set
      // to the desired size of the disk.
      autocreate_size = 600M;
    }
    // A cdrom file drive holds removable media:
    //  - read_only defaults to true for cdrom drives; a file ending in .cue
    //    is read as a BIN/CUE image and is always read-only.
    //  - When file is omitted or empty the drive starts empty; a configured
    //    file that cannot be opened prints a warning and the drive starts
    //    empty (a hard disk in the same situation is a startup error).
    //  - Ctrl+F11 in the SDL window inserts another image at runtime.
    //  - allow_guest_eject (default true): the guest may open the tray with
    //    START STOP UNIT; the image is remembered and reloaded when the guest
    //    closes the tray. While the guest has locked the drive (PREVENT
    //    MEDIUM REMOVAL) guest ejects and operator changes are refused
    //    (Ctrl+Shift+F11 forces the change).
    disk1.0 = file
    {
      file =          "img\vms83.iso";
      read_only     = true;
      cdrom         = true;
      //allow_guest_eject = true;
    }
    
    // device: create a disk using a physical device
    //
    // WARNING: making a physical disk device writeable here may
    // seriously jeopardize the contents of that disk.
    //
    // Windows syntax for device: \\.\CDRom0, \\.\PhysicalDrive0
    //
    // UNIX-like syntax for device: /dev/sda
    //
    // (Commented out because disk1.0 is already defined above; defining
    // the same disk twice silently replaces the earlier definition.)

    //disk1.0 = device
    //{
    //  device        = "\\.\CDRom0";
    //  read_only     = true;
    //  cdrom         = true;
    //}
    
    // ramdisk: create a disk using a portion of host RAM
    //
    // If a file value is given and the file exists, the ramdisk is sized to
    // the file and preloaded with its contents (a RAM-backed copy of a disk
    // image; changes are not written back to the file).
    disk1.1 = ramdisk
    {
      size = 10M;
      //file = "img\preload.img";
    }
  }

  pci0.19 = ali_usb {}

  pci0.17 = ali_pmu {}

// "Free" PCI Devices
//
// These can occupy pci0.1 .. pci0.4 and pci1.1 .. pci1.6
//
// AFAIK, VGA should always be on pci0.x.

  // S3 Trio64 VGA card
  //
  // rom: the VGA BIOS image to use.
  // The default is "vgabios.bin" in the emulator's working directory.
  // Real S3 Trio64 VGA BIOS images work, GNU vgabios project also works, but
  // may not enable or support all S3 features. The S3 Trio64 works with the
  // real S3 VGA BIOS from 86Box (roms/video/s3/86c764x1.bin) and is required
  // for ARC/AlphaBIOS and Windows NT.

  pci0.2 = s3
  {
    rom = "86c764x1.bin";
  }

  // Cirrus Logic VGA card, the other family the ES40 SRM console names.
  // Use it instead of the s3 section, not with it. Windows NT/2000 for
  // Alpha drive it with their own Cirrus driver (installed automatically).
  //
  // chip: "gd5434" (4 MB, the default) or "gd5430" (2 MB).
  // rom:  the VGA BIOS image. The default is "gd5434.bin" or "gd5430.bin"
  //       in the emulator's working directory. The real Cirrus GD543x PCI
  //       BIOS works (86Box: roms/video/cirruslogic/gd5434.BIN for the
  //       GD5434, pci.bin for the GD5430).
  //
  //pci0.2 = cirrus
  //{
  //  chip = "gd5434";
  //  rom = "gd5434.bin";
  //}

  // ATI Mach64 card, the third family the ES40 SRM console names (the
  // Mach64 CT, PCI id 1002:4354). Use it instead of the s3 section, not
  // with it. Windows 2000 for Alpha drives it with its own ATI driver
  // (atimpab.sys, on the installation media).
  //
  // chip:   "ct" (Mach64 CT, the default) or "vt2" (264VT2, PCI id
  //         1002:5654, which the console does not name).
  // memory: framebuffer size in MB: 1, 2, 4 or 8 (default 2 for the CT,
  //         4 for the VT2).
  // rom:    the VGA BIOS image. The default is "mach64ct.bin" or
  //         "mach64vt2.bin" in the emulator's working directory. The real
  //         ATI PCI BIOS works (86Box set, roms/video/mach64/:
  //         mach64-68b110b8cddfd546595673.bin for the CT,
  //         atimach64vt2pci.bin for the VT2).
  //
  //pci0.2 = mach64
  //{
  //  chip = "ct";
  //  rom = "mach64ct.bin";
  //}

  // Symbios SCSI controller
  //
  // The QLogic adapters are the other SCSI family, configured the same way
  // as the Symbios parts below, with disks at disk0.0 to disk0.15:
  //
  //   isp1020  Fast Wide
  //   isp1040  Ultra Wide -- the KZPBA the ES40 ships with
  //   isp1080  Ultra2 Wide, low-voltage differential
  //   isp1240  two Ultra Wide buses on one PCI function, so a disk names
  //            the bus it hangs on: disk0.<id> on the first, disk1.<id>
  //            on the second
  //
  // Windows 2000 has a driver of its own for each of the 1020, the 1080
  // and the 1240.
  //
  // Classes: sym53c810 (narrow, 7 disks: 0.0..0.6), and the wide parts
  // sym53c825, sym53c875 and sym53c895 (15 disks: 0.0..0.15, except 0.7,
  // the controller's own ID). SRM boots from all of them; Windows NT/2000
  // drive the 810 with symc810 and the wide parts with symc8xx.
  //
  // sym53c896 is the two-channel part: one PCI device with a complete
  // controller on each of its two functions, each with a SCSI bus of its
  // own. Disks name the channel they hang on -- disk0.<id> is the first
  // bus and disk1.<id> the second -- and the console numbers them as two
  // adapters (dka..., dkb...). Windows 2000 drives it with sym_hi, not
  // with the symc8xx that drives the single-channel wide parts.
  pci0.3 = sym53c810
  {
   disk0.0 = file
    {
      file =          "img\dka0.img";
      read_only     = false;
      cdrom         = false;
    }
    disk0.4 = file
    {
      file =          "img\scsi_cd.iso";
      read_only     = true;
      cdrom         = true;
    }
    disk0.5 = ramdisk 
    {
      size = 10M;
    }
  }

  // DEC Tulip network interface
  //
  // Classes: dec21143 (the DE500-BA, 10/100), and the older parts of the
  // same family -- dec21140 (10/100 through the general purpose port),
  // dec21041 and dec21040 (10 Mb). All four take the same values, and the
  // console boots over any of them.
  pci0.4 = dec21143 {

    // VARIABLE: adapter
    //
    // Defines the host computer's adapter to use for the emulated NIC. If you're unsure
    // of this, start the emulator without this variable set, and you will be presented
    // with a list of adapters to choose from (interactive - don't leave it
    // unset for unattended runs). You can enter the name indicated on this
    // line.
    //
    // On Linux, capturing needs a one-time permission grant on the binary:
    //   sudo setcap cap_net_raw,cap_net_admin+eip <path-to>/alphabox
    // (or run as root). Without it the emulator exits with
    // "Error opening adapter".
    //
    // Windows syntax:
    // adapter = "\Device\NPF_{F266CDC2-6BA2-43D8-8B00-1C468F737ED7}"
    //
    // Linux syntax:
    adapter = "eth0";
    
    //adapter = "\Device\NPF_{F266CDC2-6BA2-43D8-8B00-1C468F737ED7}";

    // VARIABLE: mac
    //
    // Defines the ethernet MAC address to be used by the virtual nic.
    // The variable format is: xx-xx-xx-xx-xx-xx, where all values are in hex.
    // This value should be unique on your network, or Bad Things Will Happen.
    //
    // The default value is: 08-00-2B-E5-40-<nic#>

    // mac = "08-00-2B-E5-40-00";

    // VARIABLE: type
    //
    // Selects the network backend: "pcap" (default, requires libpcap +
    // root/CAP_NET_RAW), "tap" (Linux only, host-reachable, bridgeable),
    // "udp" (a point-to-point link to another program), or "null" (not
    // connected to anything).
    //
    // "null" is the network equivalent of a serial port's null_attach: the
    // guest sees a working NIC, its transmits are discarded and no packet
    // ever arrives. It needs no host privileges, so it is the way to give a
    // machine a NIC when you only want the device present -- for testing, or
    // on a host where pcap capture is not permitted.
    //
    // type = "pcap";
    // type = "tap";
    // type = "udp";
    // type = "null";

    // TAP backend options (only used when type = "tap"):
    //
    // adapter = "tap0";         // TAP device name (created if needed)
    // host_ip = "10.0.0.1/24";  // optional: assign IP to tap on host side
    // bridge = "br0";           // optional: create bridge and add TAP to it
    // uplink = "eno1np0";       // optional: add this physical NIC to bridge too
    // tap_create = true;        // try to create if not exists (needs CAP_NET_ADMIN)

    // UDP backend options (only used when type = "udp"): each Ethernet
    // frame travels in one datagram (QEMU "-netdev dgram" framing). The
    // peer can be another Alphabox, a QEMU guest, or test/tools/net_peer.py.
    //
    // udp_local = "127.0.0.1:5555";   // where the NIC listens
    // udp_remote = "127.0.0.1:5556";  // where its frames go

    // VARIABLE: queue
    //
    // The number of frames the receive queue can hold between the host
    // capture interface and the emulated NIC. Frames that arrive while the
    // queue is full are dropped (and reported on the console). The default
    // is 1024.

    //queue = 1024;

    // VARIABLE: crc
    //
    // Calculate a real ethernet CRC (FCS) for frames delivered to the
    // guest. When false, a zeroed placeholder CRC is appended instead,
    // which saves host CPU; guests normally never check it. The default
    // is false.

    //crc = true;

    // VARIABLE: trace_packets
    //
    // Dump every transmitted and received packet to the console, for
    // network debugging. Very noisy. The default is false.

    //trace_packets = true;
  }

// PCI-PCI bridges (dec21050, dec21052, dec21152, dec21153, dec21154) take a
// slot and hold devices of their own, named pci.<device> (0-15); they nest.
// The dual-port DE602 boards (de602, de602b) are bridges whose ports,
// pci.0 and pci.1 (class de602_port / de602b_port), take the NIC options;
// a port left out is added unconnected.
//
//  pci0.3 = dec21152 {
//    pci.0 = sym53c875 {
//      disk0.0 = ramdisk { size = 10M; }
//    }
//  }
//
//  pci0.2 = de602 {
//    pci.0 = de602_port { type = "null"; }
//  }

// The other NIC family: Intel 8255x. Class de600 is the DE600-AA (an
// Intel 82559 board, "eia0" on the console); i82557, i82558 and i82559 are
// Intel's own PRO/100 boards. They take adapter, mac, type and the
// backend options above (not queue, crc or trace_packets).
//
//  pci0.5 = de600 {
//    type = "null";
//  }

// Serial ports
//
// The ES40 hardware always has two serial ports, and SRM and the guest OSes
// expect both UARTs to exist. You do not have to configure both (or either)
// of them: any port missing from this file is synthesized automatically as
// a null_attach port (see below), with a console warning.
//
// NOTE: a port configured with a "port" value WAITS for a telnet connection
// at startup before the emulator continues. This sample uses null_attach
// (nothing to connect, console on the VGA window); switch to "port" if you
// want the console on a telnet session instead.

  serial0 = serial {

    null_attach = true;

    // VARIABLE: port
    //
    // Determines which Telnet port is opened to receive connections for the
    // emulated serial port (startup then waits for a client to connect).
    // The default is 8000 + the port number.

    //port = 21264;

    // VARIABLE: action
    //
    // Defines the action to take for each serial port (= a telnet client). If you want
    // to connect manually, leave this out.

    //action = """c:\Program Files\PuTTY\putty.exe"" telnet://localhost:21264";

    // VARIABLE: null_attach
    //
    // Present the port to the guest as a healthy, idle UART with nothing
    // attached: transmitted bytes are silently discarded, nothing ever
    // arrives, and no Telnet port is opened. Use this for a port you never
    // intend to connect to. This is also what the emulator synthesizes for
    // a serial port that is left out of the configuration entirely. The
    // default is false.

    // VARIABLE: disabled
    //
    // Make the guest see no UART at this address at all, so drivers skip
    // the port completely. No Telnet port is opened. Unlike null_attach,
    // the UART appears absent rather than present-but-idle. The default
    // is false.

    //disabled = true;

    // VARIABLE: raw_mode
    //
    // Pass the byte stream through unmodified: no Telnet protocol (IAC)
    // processing and no throttling to emulated line speed. Required when
    // the port carries a binary protocol such as windbg (KD) or kgdb
    // instead of a terminal session. The default is false.

    //raw_mode = true;
  }

  serial1 = serial {
    null_attach = true;
    //port = 21265;
    //action = """c:\Program Files\PuTTY\putty.exe"" telnet://localhost:21265";
  }

// Floppy controller
//
// A floppy controller with up to 2 drives (disk0.0 and disk0.1), using the
// same disk types (file, device, ramdisk) as the other disk controllers.
// The controller is integrated in the ALi M1543C south bridge, so fdc0 is
// always present: when this section is omitted, Alphabox adds fdc0 with no
// drives attached.  Configure it only to attach drives.
//
// Raw images of the standard sizes (160K to 2.88M) are recognised; the
// geometry and data rate are derived from the image size.  A file drive
// with no file, or whose file cannot be opened (a warning is printed),
// starts with no diskette inserted; the disk-change line (DIR bit 7) is
// set while the drive is empty and after a diskette is inserted, until
// the next seek.

//fdc0 = floppy
